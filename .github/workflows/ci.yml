name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run audit
      - run: npm run design:lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  java-services:
    name: Java Services
    strategy:
      fail-fast: false
      matrix:
        include:
          - { path: services/platform-api, name: platform-api }
          - { path: services/telemetry, name: telemetry }
          - { path: services/tracking, name: tracking }
          - { path: services/load-board, name: load-board }
          - { path: services/bid, name: bid }
          - { path: services/ranking, name: ranking }
          - { path: services/settlement, name: settlement }
    uses: ./.github/workflows/_java-service.yml
    with:
      service-path: ${{ matrix.path }}
      service-name: ${{ matrix.name }}

  relational-schema:
    name: PostgreSQL/TimescaleDB Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start TimescaleDB (mirrors compose postgres-primary)
        run: |
          docker run -d --name freight-pg \
            -e POSTGRES_DB=atmospath -e POSTGRES_USER=atmospath -e POSTGRES_PASSWORD=atmospath \
            -p 5432:5432 timescale/timescaledb-ha:pg16 \
            postgres -c shared_preload_libraries=timescaledb,pg_stat_statements,pg_cron -c cron.database_name=atmospath
          for i in $(seq 1 90); do
            pg_isready -h 127.0.0.1 -U atmospath -d atmospath >/dev/null 2>&1 && break
            sleep 1
          done
          export PGPASSWORD=atmospath
          for i in $(seq 1 90); do
            [ "$(psql -h 127.0.0.1 -tAc "SELECT 1 FROM pg_extension WHERE extname='timescaledb_toolkit'" -U atmospath -d atmospath 2>/dev/null)" = "1" ] && break
            sleep 1
          done
      - name: Apply migrations V001-V017
        env:
          PGPASSWORD: atmospath
        working-directory: services/platform-api/src/main/resources/db/migration
        run: |
          for f in $(ls V0*.sql | sort -V); do
            echo "== $f"
            psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Verify schema objects
        env:
          PGPASSWORD: atmospath
        run: |
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.tenant') IS NULL THEN RAISE EXCEPTION 'missing tenant'; END IF; END \$\$;"
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.route_risk_observation') IS NULL THEN RAISE EXCEPTION 'missing route_risk_observation'; END IF; END \$\$;"
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.usage_record') IS NULL THEN RAISE EXCEPTION 'missing usage_record'; END IF; END \$\$;"
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname IN ('timescaledb','vector') ORDER BY extname;"

  containers:
    name: Container Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/api
      - run: docker build services/platform-api
      - run: docker build -f services/platform-api/Dockerfile.lambda services/platform-api
      - run: docker build services/telemetry
      - run: docker build services/tracking
      - run: docker build services/load-board
      - run: docker build services/bid
      - run: docker build services/ranking
      - run: docker build services/settlement
      - run: docker build services/weather-raster
      - run: docker build web

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - infra/bootstrap
          - infra/environments/dev
          - infra/environments/prod
          - infra/modules/freight-platform
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  security:
    name: IaC Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          hide-progress: true
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          skip-files: services/platform-api/Dockerfile.lambda

  python-security:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
