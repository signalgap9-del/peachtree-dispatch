name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run design:lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  platform-api:
    name: Spring Boot API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  relational-schema:
    name: PostgreSQL/PostGIS Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: atmospath
          POSTGRES_USER: atmospath
          POSTGRES_PASSWORD: atmospath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atmospath -d atmospath"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply PostGIS schema
        env:
          PGPASSWORD: atmospath
        run: psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -f services/platform-api/src/main/resources/db/migration/V001__identity_saved_items_postgis.sql
      - name: Verify spatial indexes and query
        env:
          PGPASSWORD: atmospath
        run: |
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "SELECT PostGIS_Version();"
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "SELECT ST_DWithin(ST_Point(-84.388, 33.749)::geography, ST_Point(-84.4, 33.75)::geography, 5000);"
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.risk_exposure');"
          psql -h 127.0.0.1 -U atmospath -d atmospath -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM pg_indexes WHERE tablename = 'risk_exposure' AND indexdef LIKE '%USING gist%';"

  containers:
    name: Container Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/api
      - run: docker build services/platform-api
      - run: docker build -f services/platform-api/Dockerfile.lambda services/platform-api
      - run: docker build services/weather-raster
      - run: docker build web

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - infra/bootstrap
          - infra/environments/dev
          - infra/environments/prod
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  security:
    name: IaC Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          hide-progress: true
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  python-security:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
