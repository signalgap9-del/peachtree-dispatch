name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Dev Plan
    if: vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=peachtree-dispatch/dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - name: Read currently deployed image URIs
        id: images
        run: |
          echo "risk_uri=$(aws lambda get-function --function-name peachtree-dispatch-dev-risk-engine --query 'Code.ImageUri' --output text)" >> "$GITHUB_OUTPUT"
          echo "platform_uri=$(aws lambda get-function --function-name peachtree-dispatch-dev-api --query 'Code.ImageUri' --output text)" >> "$GITHUB_OUTPUT"
      - run: >-
          terraform plan -no-color -input=false
          -var="enable_relational_store=false"
          -var="risk_engine_image_uri=${{ steps.images.outputs.risk_uri }}"
          -var="platform_api_image_uri=${{ steps.images.outputs.platform_uri }}"
