name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize Terraform
        working-directory: infra/environments/dev
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=peachtree-dispatch/dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - name: Bootstrap new image repositories
        working-directory: infra/environments/dev
        run: >-
          terraform apply -auto-approve -input=false
          -target=module.application.aws_ecr_repository.platform_api
          -target=module.application.aws_ecr_lifecycle_policy.platform_api
          -target=module.application.aws_ecr_repository.weather_raster
          -target=module.application.aws_ecr_lifecycle_policy.weather_raster
      - name: Build and push immutable Lambda images
        id: images
        working-directory: infra/environments/dev
        run: |
          RISK_REPOSITORY=$(terraform output -raw api_ecr_repository_url)
          PLATFORM_REPOSITORY=$(terraform output -raw platform_api_ecr_repository_url)
          WEATHER_RASTER_REPOSITORY=$(terraform output -raw weather_raster_ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${RISK_REPOSITORY%/*}"
          docker build -f ../../../services/api/Dockerfile.lambda -t "$RISK_REPOSITORY:${GITHUB_SHA}" ../../../services/api
          docker build -f ../../../services/platform-api/Dockerfile.lambda -t "$PLATFORM_REPOSITORY:${GITHUB_SHA}" ../../../services/platform-api
          docker build -f ../../../services/weather-raster/Dockerfile -t "$WEATHER_RASTER_REPOSITORY:${GITHUB_SHA}" ../../../services/weather-raster
          docker push "$RISK_REPOSITORY:${GITHUB_SHA}"
          docker push "$PLATFORM_REPOSITORY:${GITHUB_SHA}"
          docker push "$WEATHER_RASTER_REPOSITORY:${GITHUB_SHA}"
          echo "risk_uri=$RISK_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "platform_uri=$PLATFORM_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "weather_raster_uri=$WEATHER_RASTER_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Deploy application
        working-directory: infra/environments/dev
        env:
          ENABLE_HRRR_MRMS_RASTER: ${{ vars.ENABLE_HRRR_MRMS_RASTER }}
          TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          ENABLE_HRRR_MRMS_RASTER="${ENABLE_HRRR_MRMS_RASTER:-false}"
          terraform apply -auto-approve -input=false \
            -var="enable_relational_store=false" \
            -var="enable_hrrr_mrms_raster=${ENABLE_HRRR_MRMS_RASTER}" \
            -var="risk_engine_image_uri=${{ steps.images.outputs.risk_uri }}" \
            -var="platform_api_image_uri=${{ steps.images.outputs.platform_uri }}" \
            -var="weather_raster_image_uri=${{ steps.images.outputs.weather_raster_uri }}"
      - name: Build and upload web
        run: |
          API_URL=$(terraform -chdir=infra/environments/dev output -raw api_url)
          COGNITO_CLIENT_ID=$(terraform -chdir=infra/environments/dev output -raw cognito_client_id)
          COGNITO_DOMAIN=$(terraform -chdir=infra/environments/dev output -raw cognito_domain)
          GOOGLE_AUTH_ENABLED=$(terraform -chdir=infra/environments/dev output -raw google_auth_enabled)
          BUCKET=$(terraform -chdir=infra/environments/dev output -raw web_bucket_name)
          DISTRIBUTION=$(terraform -chdir=infra/environments/dev output -raw cloudfront_distribution_id)
          cd web
          npm ci
          VITE_API_URL="$API_URL" VITE_COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" VITE_COGNITO_DOMAIN="$COGNITO_DOMAIN" VITE_GOOGLE_AUTH_ENABLED="$GOOGLE_AUTH_ENABLED" VITE_GIT_SHA="${GITHUB_SHA}" npm run build
          aws s3 sync dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
      - name: Smoke test
        run: |
          WEB_URL=$(terraform -chdir=infra/environments/dev output -raw web_url)
          COGNITO_CLIENT_ID=$(terraform -chdir=infra/environments/dev output -raw cognito_client_id)
          COGNITO_DOMAIN=$(terraform -chdir=infra/environments/dev output -raw cognito_domain)
          curl --fail --retry 8 --retry-delay 5 "$WEB_URL/"
          curl --fail "$WEB_URL/api/health"
          curl --fail "$WEB_URL/api/risk/weather-raster" | jq -e '.generated_at and .expires_at and .url'
          ORIGIN=$(curl --fail --silent "$WEB_URL/api/places/search?q=Miami" | jq '.[0]')
          DESTINATION=$(curl --fail --silent "$WEB_URL/api/places/search?q=West%20Palm%20Beach" | jq '.[0]')
          DIRECTIONS_PAYLOAD=$(jq -n \
            --argjson origin "$ORIGIN" \
            --argjson destination "$DESTINATION" \
            '{origin: $origin, destination: $destination, vehicle_type: "CAR"}')
          if ! curl --fail --show-error --max-time 28 \
            -H "Content-Type: application/json" \
            -d "$DIRECTIONS_PAYLOAD" \
            "$WEB_URL/api/directions"; then
            aws logs tail "/aws/lambda/peachtree-dispatch-dev-api" --since 10m || true
            aws logs tail "/aws/lambda/peachtree-dispatch-dev-risk-engine" --since 10m || true
            exit 1
          fi
          test -n "$(terraform -chdir=infra/environments/dev output -raw dynamodb_table_name)"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${COGNITO_DOMAIN}/oauth2/authorize?client_id=${COGNITO_CLIENT_ID}&response_type=code&scope=openid&redirect_uri=${WEB_URL}%2F&code_challenge_method=S256&code_challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA")" = "302"
