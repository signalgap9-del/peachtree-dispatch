name: Bootstrap Dev Platform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize Terraform
        working-directory: infra/environments/dev
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=peachtree-dispatch/dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - name: Create Spring platform ECR repository without changing running services
        working-directory: infra/environments/dev
        run: >-
          terraform apply -auto-approve -input=false
          -target=module.application.aws_ecr_repository.platform_api
          -target=module.application.aws_ecr_lifecycle_policy.platform_api
