name: Promote Production

on:
  workflow_dispatch:
    inputs:
      risk_engine_image_uri:
        description: Immutable Python risk-engine image URI that passed dev smoke tests
        required: true
        type: string
      platform_api_image_uri:
        description: Immutable Spring platform API image URI that passed dev smoke tests
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize Terraform
        working-directory: infra/environments/prod
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=peachtree-dispatch/prod/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - name: Promote immutable service images
        working-directory: infra/environments/prod
        run: >-
          terraform apply -auto-approve -input=false
          -var="risk_engine_image_uri=${{ inputs.risk_engine_image_uri }}"
          -var="platform_api_image_uri=${{ inputs.platform_api_image_uri }}"
      - name: Deploy production web
        run: |
          API_URL=$(terraform -chdir=infra/environments/prod output -raw api_url)
          BUCKET=$(terraform -chdir=infra/environments/prod output -raw web_bucket_name)
          DISTRIBUTION=$(terraform -chdir=infra/environments/prod output -raw cloudfront_distribution_id)
          cd web
          npm ci
          VITE_API_URL="$API_URL" npm run build
          aws s3 sync dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
      - name: Production smoke test
        run: |
          API_URL=$(terraform -chdir=infra/environments/prod output -raw api_url)
          curl --fail --retry 8 --retry-delay 5 "$API_URL/health"
