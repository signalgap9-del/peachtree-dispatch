name: Nightly Operational Tests

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    if: vars.DEV_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Health and asynchronous optimization smoke test
        env:
          API_URL: ${{ vars.DEV_API_URL }}
        run: |
          curl --fail "$API_URL/health"
          JOB_ID=$(curl --fail -X POST "$API_URL/optimizations" | jq -r .job_id)
          test -n "$JOB_ID"
          for _ in {1..20}; do
            STATUS=$(curl --fail "$API_URL/optimizations/$JOB_ID" | jq -r .status)
            if [[ "$STATUS" == "SUCCEEDED" ]]; then
              exit 0
            fi
            if [[ "$STATUS" == "FAILED" ]]; then
              exit 1
            fi
            sleep 3
          done
          echo "Optimization job did not finish within 60 seconds"
          exit 1
