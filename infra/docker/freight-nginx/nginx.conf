worker_processes auto;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Logging with trace-id
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'trace_id=$http_x_request_id rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting: token bucket, 100 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # ── Upstreams (least_conn + keepalive) ──

    upstream telemetry_up {
        least_conn;
        server telemetry-1:8080;
        server telemetry-2:8080;
        keepalive 128;
    }

    upstream tracking_up {
        least_conn;
        server tracking-1:8080;
        server tracking-2:8080;
        keepalive 128;
    }

    upstream loadboard_up {
        server load-board:8080;
        keepalive 64;
    }

    upstream bid_up {
        server bid:8080;
        keepalive 64;
    }

    upstream ranking_up {
        server ranking:8080;
        keepalive 64;
    }

    upstream settlement_up {
        server settlement:8080;
        keepalive 64;
    }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # Timeouts (failure isolation)
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Trace-id propagation: generate if missing
        if ($http_x_request_id = "") {
            set $http_x_request_id $request_id;
        }
        proxy_set_header X-Request-Id $http_x_request_id;

        # ── Telemetry (GPS ingestion) ──
        location /telemetry {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://telemetry_up;
        }

        # ── Tracking REST API ──
        location /tracking {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://tracking_up;
        }

        # ── Load Board (freight posting) ──
        location /loads {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://loadboard_up;
        }

        # ── Bidding ──
        location /bids {
            limit_req zone=api_limit burst=100 nodelay;  # higher burst for bid spikes
            proxy_pass http://bid_up;
        }

        # ── Carrier Rankings ──
        location /rankings {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://ranking_up;
        }

        # ── Settlement ──
        location /settlements {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://settlement_up;
        }

        # ── Tracking WebSocket (real-time positions) ──
        location /ws/tracking {
            proxy_pass http://tracking_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;  # long-lived connections
            proxy_send_timeout 3600s;
        }

        # ── Health check ──
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
