AWSTemplateFormatVersion: "2010-09-09"
Description: Cost guardrail for the AWS resume project

Parameters:
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: awsresumeproject-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
