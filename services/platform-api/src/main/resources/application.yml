spring:
  application:
    name: atmospath-platform-api
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
atmospath:
  saas:
    enabled: ${SAAS_ENABLED:false}
  datasource:
    # Primary goes through PgBouncer (transaction pooling): prepareThreshold=0
    # keeps server-prepared statements off.
    primary-url: ${DATASOURCE_PRIMARY_URL:jdbc:postgresql://localhost:6432/atmospath?prepareThreshold=0}
    replica-url: ${DATASOURCE_REPLICA_URL:}
    username: ${DATASOURCE_USERNAME:atmospath}
    password: ${DATASOURCE_PASSWORD:}
    max-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
    connection-timeout-ms: ${DATASOURCE_CONNECTION_TIMEOUT_MS:5000}
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
  cdc:
    enabled: ${CDC_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  risk-engine-mode: ${RISK_ENGINE_MODE:http}
  risk-engine-url: ${RISK_ENGINE_URL:http://localhost:8000}
  risk-engine-function-name: ${RISK_ENGINE_FUNCTION_NAME:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  api-origin-verify-secret: ${API_ORIGIN_VERIFY_SECRET:}
  default-plan: ${ATMOSPATH_DEFAULT_PLAN:FREE}
  auth:
    enabled: ${AUTH_ENABLED:false}
    issuer-uri: ${AUTH_ISSUER_URI:}
  saved-place-store: ${SAVED_PLACE_STORE:none}
  usage-store: ${USAGE_STORE:memory}
  idempotency-store: ${IDEMPOTENCY_STORE:memory}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    store: ${RATE_LIMIT_STORE:memory}
    window: ${RATE_LIMIT_WINDOW:PT1M}
    public-read-limit-per-minute: ${RATE_LIMIT_PUBLIC_READ_PER_MINUTE:180}
    mutation-limit-per-minute: ${RATE_LIMIT_MUTATION_PER_MINUTE:30}
    authenticated-mutation-limit-per-minute: ${RATE_LIMIT_AUTHENTICATED_MUTATION_PER_MINUTE:90}
  alert-stream:
    enabled: ${ALERT_STREAM_ENABLED:true}
    # polling: poll the risk engine (default). pubsub: receive alert state
    # changes from Redis Pub/Sub (requires the SaaS stack publishing them).
    mode: ${ALERT_STREAM_MODE:polling}
    poll-interval-ms: ${ALERT_STREAM_POLL_INTERVAL:30000}
    heartbeat-interval-ms: ${ALERT_STREAM_HEARTBEAT_INTERVAL:15000}
    emitter-timeout-ms: ${ALERT_STREAM_EMITTER_TIMEOUT:300000}
  dynamodb-table: ${DYNAMODB_TABLE:}
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:http://localhost:4000}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:atmospath}
    max-tokens: ${LLM_MAX_TOKENS:2000}
    temperature: ${LLM_TEMPERATURE:0.3}
    timeout-ms: ${LLM_TIMEOUT_MS:30000}
    daily-token-budget: ${LLM_DAILY_TOKEN_BUDGET:100000}
    request-token-limit: ${LLM_REQUEST_TOKEN_LIMIT:2000}
    security:
      max-input-length: ${LLM_MAX_INPUT_LENGTH:2000}
      max-output-length: ${LLM_MAX_OUTPUT_LENGTH:5000}
    rag:
      enabled: ${RAG_ENABLED:false}
      embedding-model: ${EMBEDDING_MODEL:text-embedding-v3}
      embedding-dimensions: ${EMBEDDING_DIMENSIONS:384}
      search-top-k: ${RAG_SEARCH_TOP_K:10}
      rerank-top-k: ${RAG_RERANK_TOP_K:3}
      rrf-k: ${RAG_RRF_K:60}
      similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.3}
  relational:
    enabled: ${RELATIONAL_STORE_ENABLED:false}
    initialize-schema: ${RELATIONAL_INITIALIZE_SCHEMA:false}
    database: ${RELATIONAL_DATABASE:atmospath}
    resource-arn: ${RELATIONAL_RESOURCE_ARN:}
    secret-arn: ${RELATIONAL_SECRET_ARN:}
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    host: ${LANGFUSE_HOST:http://localhost:3000}
