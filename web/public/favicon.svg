  <path d="M17 44 C 24 44, 26 36, 32 32 C 38 28, 40 22, 47 20" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- Origin dot -->
  <circle cx="17" cy="44" r="5" fill="#FFFFFF"/>
  <!-- Destination: amber weather-alert beacon -->
  <circle cx="47" cy="20" r="6.5" fill="#F9AB00"/>
  <!-- Alert chevron inside beacon -->
  <path d="M47 16.5 L50 21.5 L44 21.5 Z" fill="#0B57D0"/>
</svg>
