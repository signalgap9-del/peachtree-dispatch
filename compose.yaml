services:
  postgres:
    image: postgis/postgis:16-3.4
    profiles: ["relational"]
    environment:
      POSTGRES_DB: atmospath
      POSTGRES_USER: atmospath
      POSTGRES_PASSWORD: atmospath-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/platform-api/src/main/resources/db/migration/V001__identity_saved_items_postgis.sql:/docker-entrypoint-initdb.d/V001__identity_saved_items_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmospath -d atmospath"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_PATH: /data/peachtree.db
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  platform-api:
    build:
      context: ./services/platform-api
    environment:
      RISK_ENGINE_URL: http://api:8000
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'
      interval: 10s
      timeout: 3s
      retries: 8

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - platform-api
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:5173
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── production-data profile ───────────────────────────────────────
  # Start with: docker compose --profile production-data up

  postgres-primary:
    image: timescale/timescaledb:latest-pg16
    profiles: ["production-data"]
    environment:
      POSTGRES_DB: atmospath
      POSTGRES_USER: atmospath
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init/01-replication.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      - -c
      - hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmospath -d atmospath"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-replica:
    image: timescale/timescaledb:latest-pg16
    profiles: ["production-data"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: atmospath
      POSTGRES_USER: atmospath
      POSTGRES_PASSWORD: devpassword
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: "5432"
      REPL_USER: replicator
      REPL_PASSWORD: replicator_password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init/02-replica-setup.sh:/02-replica-setup.sh:ro
    entrypoint: ["/bin/bash", "/02-replica-setup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmospath -d atmospath"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer
    profiles: ["production-data"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DB_HOST: postgres-primary
      DB_PORT: "5432"
      DB_USER: atmospath
      DB_PASSWORD: devpassword
      DB_NAME: atmospath
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "25"
    ports:
      - "6432:6432"
    volumes:
      - ./infra/docker/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/docker/pgbouncer-users.txt:/etc/pgbouncer/userlist.txt:ro

  redis:
    image: redis:7-alpine
    profiles: ["production-data"]
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    profiles: ["production-data"]
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node configuration (no Zookeeper)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  debezium:
    image: debezium/connect:2.7
    profiles: ["production-data"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect-group
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Pre-configure PostgreSQL connector for alert_event CDC
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["production-data"]
    ports:
      - "4000:4000"
    volumes:
      - ./infra/docker/litellm/config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-dev-master-key}
      - ALIBABA_API_KEY=${LLM_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  langfuse:
    image: langfuse/langfuse:latest
    profiles: ["production-data"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@postgres-primary:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres-primary:
        condition: service_healthy

volumes:
  api-data:
  postgres-data:
  pg-primary-data:
  pg-replica-data:
  redis-data:
  kafka-data:
