services:
  api:
    build:
      context: ./services/api
    environment:
      DATABASE_PATH: /data/peachtree.db
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  platform-api:
    build:
      context: ./services/platform-api
    environment:
      RISK_ENGINE_URL: http://api:8000
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'
      interval: 10s
      timeout: 3s
      retries: 8

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - platform-api
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:5173
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  api-data:
